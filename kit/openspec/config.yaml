## Rules for artifacts
- proposal: keep under 500 words. Always include "Non-goals".
- tasks: each task must be completable in one agent session; max ~15 tasks
  per change; each task names the files it touches.
- design: required only when the change touches more than 3 files or changes
  a public contract.
